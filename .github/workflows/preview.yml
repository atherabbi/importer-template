# Temporary home for a site on GitHub Pages, before real hosting and a domain are connected.
# Built as a preview: pages carry a noindex tag so search engines wait for the real address.
# Runs in the template repository, and in any site where the repository variable GITHUB_PAGES_PREVIEW is set to "on".
name: Preview on GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.repository == 'atherabbi/importer-template' || vars.GITHUB_PAGES_PREVIEW == 'on'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build the site
        run: node build.mjs
        env:
          PREVIEW_URL: ${{ steps.pages.outputs.base_url }}
          CMS_REPO: ${{ github.repository }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
